name: FoodRush CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/harishrao9/foodrush

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: tag
        run: echo "VERSION=$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build -f docker/Dockerfile \
            -t ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.VERSION }} \
            -t ${{ env.IMAGE_NAME }}:latest .

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.VERSION }}
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: Update image tag in Helm values
        run: |
          sed -i "s|tag:.*|tag: ${{ steps.tag.outputs.VERSION }}|" helm/values.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add helm/values.yaml
          git commit -m "ci: update image tag to ${{ steps.tag.outputs.VERSION }}"
          git push